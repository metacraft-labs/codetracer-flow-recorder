name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout metacraft-manifests (workspace locks)
        uses: actions/checkout@v5
        with:
          repository: metacraft-labs/metacraft-manifests
          ref: latest
          path: _manifests
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve cross-repo workspace-lock SHA
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) CANDS="${{ github.event.pull_request.base.sha }}" ;;
            push) CANDS="${{ github.sha }} ${{ github.event.before }}" ;;
            *) CANDS="${{ github.sha }}" ;;
          esac
          LOCK_SHA=""
          for c in $CANDS; do
            [ -z "$c" ] && continue
            [ "$c" = "0000000000000000000000000000000000000000" ] && continue
            if "${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
                 --repo codetracer-flow-recorder --sibling codetracer \
                 --manifest-dir "${{ github.workspace }}/_manifests" \
                 --sha "$c" --no-walk >/dev/null 2>&1; then
              LOCK_SHA="$c"; break
            fi
          done
          if [ -z "$LOCK_SHA" ]; then
            echo "::error::No repo-workspaces workspace lock for codetracer-flow-recorder (candidates: $CANDS). The commit must be published through the workspace tooling (pre-push hook / 'workspace lock')."
            exit 1
          fi
          echo "CT_MANIFEST_DIR=${{ github.workspace }}/_manifests" >> "$GITHUB_ENV"
          echo "CT_LOCK_SHA=$LOCK_SHA" >> "$GITHUB_ENV"
          echo "Resolved cross-repo lock SHA for codetracer-flow-recorder: $LOCK_SHA"

      - name: Clone codetracer-trace-format (Cargo path dependency)
        run: |
          # The resolver returns the workspace-locked SHA (not a branch
          # name), so fetch that exact commit and check it out detached.
          TF_REF="$("${{ github.workspace }}/scripts/resolve-sibling-rev.sh" \
            --repo codetracer-flow-recorder --sibling codetracer-trace-format \
            --manifest-dir "$CT_MANIFEST_DIR" --sha "$CT_LOCK_SHA" --no-walk)"
          DEST="${GITHUB_WORKSPACE}/../codetracer-trace-format"
          rm -rf "$DEST"
          git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" "$DEST"
          git -C "$DEST" fetch --depth 1 origin "${TF_REF}"
          git -C "$DEST" checkout --detach FETCH_HEAD


      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim trace writer library
        run: |
          git clone --depth 1 \
            "https://github.com/metacraft-labs/codetracer-trace-format-nim.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          nimble install -y stew results
          nim c --app:staticlib --mm:arc --noMain -d:release -p:src \
            -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests with zero-test guard
        run: |
          set -euo pipefail
          OUTPUT=$(cargo test --all-targets 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          # Guard against silently empty test suites
          if ! echo "$OUTPUT" | grep -qP "test result: ok\. [1-9]"; then
            echo "::error::Zero tests passed — check that test binaries are compiling correctly"
            exit 1
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
